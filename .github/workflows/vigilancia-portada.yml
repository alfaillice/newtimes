name: Vigilancia portada
# Comprueba cada hora (8-23 h Madrid) que la barra de última hora de la portada
# muestra una noticia de menos de 3 horas. El vigilante de la redacción lee el
# resultado de esta ejecución en lugar de descargar la portada él mismo.
on:
  schedule:
    - cron: '5 7-22 * * *'
  workflow_dispatch:

jobs:
  portada:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar última hora
        run: |
          python3 - <<'PY'
          import re, sys, time, urllib.request, os
          from datetime import datetime, timezone
          url = f"https://newtimes.news/?c={int(time.time())}"
          req = urllib.request.Request(url, headers={"User-Agent": "NewTimes-vigilancia/1.0"})
          html = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          resumen = os.environ.get("GITHUB_STEP_SUMMARY")
          def salida(msg, ok):
              print(msg)
              if resumen:
                  with open(resumen, "a") as f:
                      f.write(msg + "\n")
              sys.exit(0 if ok else 1)
          m = re.search(r'class="ultima-hora__titular"><time datetime="([^"]+)">[^<]*</time>\s*<a href="([^"]+)">([^<]+)</a>', html)
          if not m:
              salida("ERROR: no se encuentra la barra de última hora en la portada", False)
          fecha = datetime.fromisoformat(m.group(1))
          if fecha.tzinfo is None:
              fecha = fecha.replace(tzinfo=timezone.utc)
          horas = (datetime.now(timezone.utc) - fecha).total_seconds() / 3600
          estado = "OK" if horas < 3 else "PORTADA SIN ACTUALIZAR"
          salida(f"{estado}: última hora {m.group(1)} (hace {horas:.1f} h) · {m.group(3).strip()} · {m.group(2)}", horas < 3)
          PY
