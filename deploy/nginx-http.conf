# Configuración provisional mientras se obtiene el certificado
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMINIO__ www.__DOMINIO__;

    location /.well-known/acme-challenge/ { root __ACME__; }

    root __WEB__;
    index index.html;
    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
}
