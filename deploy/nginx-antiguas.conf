# Direcciones de la web anterior que siguen en el índice de los buscadores.
# Las categorías se redirigen a su sección nueva (301); las noticias antiguas
# eran contenido agregado de otros medios y se dan por eliminadas (410), para
# que Google las retire cuanto antes.
error_page 410 /404.html;

location ^~ /noticias/    { return 410; }
location ^~ /es/noticias/ { return 410; }
location ^~ /en/noticias/ { return 410; }
location ^~ /fr/noticias/ { return 410; }
location ^~ /cover/       { return 410; }
location ^~ /t/           { return 410; }
location = /img           { return 410; }

location = /categoria/mundo         { return 301 /seccion/internacional/; }
location = /categoria/politica      { return 301 /seccion/espana/; }
location = /categoria/economia      { return 301 /seccion/economia/; }
location = /categoria/deportes      { return 301 /seccion/deportes/; }
location = /categoria/tecnologia    { return 301 /seccion/tecnologia/; }
location = /categoria/ciencia-salud { return 301 /seccion/ciencia-salud/; }
location = /categoria/cultura       { return 301 /seccion/cultura/; }
location ^~ /categoria/             { return 301 /; }
location ^~ /es/                    { return 301 /; }
location = /es                      { return 301 /; }
location ^~ /en/categoria/          { return 302 /; }
location ^~ /fr/categoria/          { return 302 /; }

# Secciones previstas que aún no existen: redirección temporal a portada
location = /tal-dia-como-hoy { return 302 /; }
location = /horoscopo        { return 302 /; }
location = /juegos           { return 302 /; }
