server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMINIO__ www.__DOMINIO__;
    location /.well-known/acme-challenge/ { root __ACME__; }
    location / { return 301 https://__DOMINIO__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMINIO__;
    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    return 301 https://__DOMINIO__$request_uri;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name __DOMINIO__;

    ssl_certificate     /etc/letsencrypt/live/__DOMINIO__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMINIO__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root __WEB__;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/newtimes-cabeceras.conf;

    gzip on;
    gzip_types text/css application/javascript application/json application/rss+xml application/xml image/svg+xml;
    gzip_min_length 512;

    error_page 404 /404.html;

    include /etc/nginx/snippets/newtimes-antiguas.conf;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=60" always;
        include /etc/nginx/snippets/newtimes-cabeceras.conf;
    }

    location ~* \.(css|js|woff|woff2|png|svg|webp|jpg|jpeg)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        include /etc/nginx/snippets/newtimes-cabeceras.conf;
        try_files $uri =404;
    }

    location ~ \.xml$ { add_header Cache-Control "public, max-age=300" always; include /etc/nginx/snippets/newtimes-cabeceras.conf; try_files $uri =404; }
}
