seccion: espana
tema: El avance del informe pericial sobre el accidente ferroviario de Adamuz (Córdoba, 18 de enero, 46 muertos) apunta a una soldadura defectuosa y a un bache en la vía como causas probables, y los investigadores alertan del riesgo de que se repita. Contar solo lo que dicen las fuentes.
destacado: false
fuentes:
- medio: ABC
  titulo: Los peritos de Adamuz señalan a la rotura de la soldadura por mala ejecución o el bache en la vía
  url: https://www.abc.es/espana/andalucia/cordoba/peritos-adamuz-senalan-rotura-soldadura-mala-ejecucion-20261125143536-nts.html
- medio: El Mundo
  titulo: Los investigadores de la Aitat alertan del riesgo de que se repita la tragedia de Adamuz
  url: https://www.elmundo.es/andalucia/2026/11/25/6b06b5b721efa046268b458d.html
motivo: 'la verificación encontró datos sin sostén: "con el resultado de víctimas mortales que el avance atribuye al descarrilamiento inicial": ninguna fuente dice que el avance pericial atribuya las muertes al descarrilamiento inicial. El Mundo indica que el Aitat considera que, de haberse detectado la rotura, el descarrilamiento y la colisión "con toda probabilidad" no se habrían producido, pero eso es un informe distinto y no una atribución del avance.; "(Córdoba)" en la entradilla de lugar: las fuentes sitúan el accidente en Adamuz y citan un tribunal de Montoro, pero no indican la provincia de Córdoba.'
