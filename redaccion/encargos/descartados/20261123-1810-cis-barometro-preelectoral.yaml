motivo: 'la verificación encontró datos sin sostén: "una mayoría de quienes respondieron desea la victoria de la izquierda": las fuentes no lo sustentan. La Fuente 1 da un 36,6% que querría la victoria de Pedro Sánchez, un 22,9% que cita al PP y un 10,6% que menciona a Vox, sin ninguna cifra agregada de izquierda. La Fuente 2 da un 42,3% que desearía la victoria del PSOE frente al 26,5% del PP. Ninguna cifra alcanza por sí sola la mayoría.'
