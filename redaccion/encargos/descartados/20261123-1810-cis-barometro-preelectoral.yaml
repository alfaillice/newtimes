tema: El último barómetro del CIS antes de las elecciones del 29 de noviembre da al PSOE una ventaja de casi diez puntos sobre el PP; Vox y Frente Amplio bajan. Contar las estimaciones y las reacciones recogidas en las fuentes, atribuyendo el cálculo alternativo a quien lo hace.
