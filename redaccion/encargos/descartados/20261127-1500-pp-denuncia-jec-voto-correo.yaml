motivo: 'la verificación encontró datos sin sostén: "como reconoce el propio escrito, ya no es posible porque el plazo ha concluido": la fuente atribuye al escrito del PP la petición de reparto urgente, pero la idea de que ya no es posible por haber concluido el plazo es una apreciación del redactor de Europa Press, no una admisión del escrito del PP.; "Tampoco ha podido hacerlo en la práctica": ninguna de las fuentes afirma que la Junta no haya podido requerir a Correos en la práctica; es una afirmación añadida sin respaldo en las fuentes.'
