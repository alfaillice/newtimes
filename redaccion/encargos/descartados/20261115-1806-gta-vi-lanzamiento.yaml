motivo: 'el agente descarta el tema: Las fuentes no permiten una noticia rigurosa en este turno. La FUENTE 1 lleva fecha del 16/11/2026, posterior a la fecha de hoy (15/11/2026, 18:15), así que no puede verificarse como publicada. La FUENTE 2, fechada el 15/11, sitúa la visita «un mes antes» del lanzamiento, lo que contradice la fecha del 19/11. Además, el grueso del supuesto impacto económico (la «GTA Flu») procede de cifras y estimaciones que la propia FUENTE 1 describe como poco contrastadas, y el dato sobre los 34 despidos se presenta con fechas distintas en cada texto (la FUENTE 1 dice «en octubre» y la FUENTE 2, «el año pasado»).'
