motivo: 'la verificación encontró datos sin sostén: El artículo dice que el City «se adelantó en el minuto 86 gracias a un gol de Ayyoub Bouaddi» y que luego el Nápoles respondió con Lang. Las fuentes (The Guardian) indican que Bouaddi igualó 1-1 tras el gol de Højlund, que Lang marcó el 1-2 para el Nápoles y que Cherki empató 2-2 en el minuto 86. Bouaddi no marcó en el minuto 86 ni adelantó al City, y la secuencia del artículo es incoherente porque el propio texto atribuye a Cherki el empate en ese mismo minuto.'
