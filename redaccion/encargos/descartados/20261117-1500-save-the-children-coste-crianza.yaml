motivo: 'la verificación encontró datos sin sostén: "Por el momento, el Ejecutivo no ha concretado cuándo ni si se producirá esa votación." Las fuentes no dicen que el Gobierno no haya concretado nada. Solo recogen que Elma Saiz no descartó que alguna medida se apruebe en un Consejo de Ministros extraordinario antes del 29 de noviembre, y que "contamos las cuestiones cuando se alcanzan". La afirmación sobre lo que no se ha concretado es una inferencia no respaldada.'
