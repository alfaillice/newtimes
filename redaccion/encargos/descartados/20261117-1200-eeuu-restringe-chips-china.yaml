motivo: 'la verificación encontró datos sin sostén: "Megaspeed International ... ha sido señalada en EEUU como posible espía china": las fuentes señalan como posible espía a Alice Huang, no a la empresa. Europa Press la describe como exejecutiva señalada, y la BBC dice que Alice Huang es sospechosa de ser espía china. Atribuir la sospecha a la empresa no está respaldado.; "Los analistas consultados por la BBC coinciden en que los países más expuestos son Malasia y Tailandia": en la BBC solo el experto Naoise McDonagh dice que Malasia y Tailandia podrían ser los más afectados. Hablar de consenso entre analistas no está sostenido por la fuente.'
