motivo: 'la verificación encontró datos sin sostén: "policía drogadicto" (Cheech and Chong): la fuente dice "stoner cop", que se refiere a un policía consumidor de marihuana, no a un drogadicto. La traducción distorsiona el papel.; "Años después, ya en libertad, testificó ante el Congreso": la fuente dice solo que testificó tras salir de prisión ("After prison"). El "años después" no aparece en las fuentes.'
