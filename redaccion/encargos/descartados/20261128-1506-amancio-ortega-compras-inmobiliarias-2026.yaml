seccion: economia
tema: Amancio Ortega cerrará 2026 con más de 2.400 millones de euros en compras inmobiliarias. Detallar las operaciones que citan las fuentes.
destacado: false
fuentes:
- medio: ABC
  titulo: Amancio Ortega cerrará 2026 con más de 2.400 millones en compras inmobiliarias
  url: https://www.abc.es/economia/amancio-ortega-cerrara-2026-2000-millones-invertidos-20261128142559-nt.html
- medio: Xataka
  titulo: Amancio Ortega acaba de colarse en un 'Top 10' de grandes inversiones mundiales. Y para sorpresa de nadie incluye un rascacielos
  url: https://www.xataka.com/empresas-y-economia/amancio-ortega-acaba-colarse-top-10-grandes-inversiones-mundiales-para-sorpresa-nadie-incluye-rascacielos
motivo: 'el agente descarta el tema: Las fuentes no bastan para una noticia rigurosa. La única fuente de la lista de medios de referencia para economía es ABC, y la cifra de 2.400 millones que da como total anual no coincide con sus propios datos: habla de más de 2.000 millones en compras y de otros 1.000 millones en logística, sin aclarar si la suma es 2.400 o 3.000. La compra de Lisboa procede de una información de un diario portugués que ABC recoge, sin confirmación de una agencia, una fuente oficial o un segundo medio de la lista. Xataka no figura entre las fuentes de referencia de economía, y su operación de Chicago (550 millones de dólares) se atribuye a una información que no aparece en la fuente de la lista ni en otra fuente verificada. Se necesita confirmar el total y las operaciones con una agencia (EFE, Europa Press, Reuters, AFP o AP) o con un registro oficial o de la CNMV antes de publicar.'
descartado: '2026-11-28T15:10:43+01:00'
