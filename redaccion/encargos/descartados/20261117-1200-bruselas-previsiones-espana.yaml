tema: Las previsiones económicas de otoño de Bruselas mejoran al 2,6 % el crecimiento previsto para España este año y elevan la inflación al 3,9 %; destacan el efecto de la regularización de migrantes en el empleo, con un paro que seguirá entre los más altos de la UE.
