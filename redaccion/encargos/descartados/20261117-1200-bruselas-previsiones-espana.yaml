motivo: 'la verificación encontró datos sin sostén: «La Comisión eleva una décima su previsión de déficit para 2026, hasta el 2,6 % del PIB, frente al 2,4 %»: las fuentes dicen que la eleva «dos décimas» (de 2,4 % a 2,6 %). La cifra de «una décima» contradice la diferencia entre 2,4 % y 2,6 %.'
