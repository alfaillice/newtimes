seccion: economia
tema: En el debate económico de La Sexta de este viernes, previo a las elecciones del 29 de noviembre, PP y Vox prometen bajar impuestos mientras PSOE y Frente Amplio cuestionan cómo lo harán sin recortar servicios; Carlos Cuerpo garantiza que las pensiones se revalorizarán con el IPC si gobierna el PSOE y admite que el gasto necesita revisiones.
