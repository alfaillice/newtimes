motivo: 'la verificación encontró datos sin sostén: «el neto real de los salarios ha caído un 3,8 %»: la fuente 1 dice que el neto real «ha caído al 3,8%», es decir, que llegó a esa cifra. El artículo la presenta como una caída de un 3,8 %, lo que cambia el sentido de la cifra.'
