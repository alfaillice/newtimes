seccion: deportes
tema: Lionel Scaloni renueva como seleccionador de Argentina hasta después del Mundial 2030, tras las dudas que sembró después del torneo de este verano.
destacado: false
fuentes:
- medio: Europa Press
  titulo: Scaloni renueva al frente de Argentina hasta 2030
  url: https://www.europapress.es/deportes/futbol-00162/noticia-scaloni-renueva-frente-argentina-2030-20261112203032.html
motivo: 'la verificación encontró datos sin sostén: "desde el primer momento su objetivo había sido convencerle": la fuente dice que desde la AFA "dejaron claro que su objetivo era convencer al técnico", pero no que fuera desde el primer momento. Es un añadido temporal no respaldado.; "Con ella, la federación busca dar estabilidad a un equipo que, según el comunicado, mantiene su proyecto deportivo bajo la dirección del técnico": ni el objetivo de dar estabilidad ni la atribución al comunicado aparecen en las fuentes. La fuente solo indica que la AFA quería convencer a Scaloni para que siguiera.'
