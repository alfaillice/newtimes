motivo: 'la verificación encontró datos sin sostén: Titular y entradilla de primer párrafo: «Por primera vez en unas elecciones generales» / «será la primera vez que se vota en generales con el DNI digital» es una atribución que no aparece en ninguna de las dos fuentes. Ambas hablan de la autorización de la Junta Electoral Central para el 29N, pero ninguna afirma que sea la primera vez que se usa en unas generales.'
