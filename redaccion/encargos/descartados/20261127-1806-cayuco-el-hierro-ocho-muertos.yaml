seccion: sociedad
tema: 'Al menos ocho personas muertas y seis heridas, evacuadas en helicóptero, en un cayuco rescatado este viernes a la deriva frente a El Hierro tras ser localizado por un velero; la patrullera Río Tajo lo remolca hacia la isla. Las fuentes difieren en la distancia a la costa: si se da, atribúyase a quien la ofrece o no se dé.'
