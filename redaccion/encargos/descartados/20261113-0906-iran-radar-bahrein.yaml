motivo: 'el agente descarta el tema: Única fuente: un solo artículo de Europa Press que recoge un comunicado de la Guardia Revolucionaria, distribuido por Tasnim. Ni el bombardeo en Sirik ni el ataque contra el radar en Bahréin están confirmados por ninguna otra fuente de la lista, y CENTCOM y las autoridades de Bahréin no se han pronunciado. Con los datos disponibles, el texto no alcanzaría la extensión mínima de 250 palabras sin repetir o rellenar, y no permitiría atribuir de forma independiente los hechos. Conviene esperar a una confirmación de una fuente oficial o de dos medios de la lista, o a una respuesta de CENTCOM o de Bahréin.'
