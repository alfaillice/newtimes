seccion: internacional
tema: La Guardia Revolucionaria de Irán afirma haber destruido un radar de alerta temprana de EEUU en Bahréin en represalia por un bombardeo contra una torre de telecomunicaciones en Sirik.
destacado: false
fuentes:
- medio: Europa Press
  titulo: La Guardia Revolucionaria de Irán afirma haber destruido un radar de EEUU en Bahréin tras un ataque contra Sirik
