motivo: 'la verificación encontró datos sin sostén: «las autoridades costarricenses no han explicado públicamente los motivos de la prohibición de entrada» contradice las fuentes: según elDiario.es, el director de Migración, Homer Badilla, aseguró públicamente que la prohibición se debió a «vínculos con actos terroristas». Además, el propio artículo lo recoge en su segundo párrafo, por lo que la afirmación final es incoherente con el resto del texto.'
