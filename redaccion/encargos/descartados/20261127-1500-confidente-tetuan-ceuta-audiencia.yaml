motivo: 'la verificación encontró datos sin sostén: "Un confidente de las Fuerzas y Cuerpos de Seguridad españolas": la descripción procede de ABC, pero El Mundo indica que el testigo era confidente del jefe de la Policía de Tetuán, de quien cobraba de forma ilegal y recibía instrucciones, y que declaró ante agentes del Cenif. El artículo no recoge esta contradicción entre fuentes.; "Lugar: Madrid": ninguna fuente indica que la comparecencia o la información se produjera en Madrid. Las fuentes solo dicen que la jueza es de la Audiencia Nacional y que la declaración fue por videoconferencia.'
