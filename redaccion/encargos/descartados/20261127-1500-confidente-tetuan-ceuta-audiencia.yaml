seccion: espana
tema: Un confidente de las Fuerzas de Seguridad declara este viernes ante la jueza de la Audiencia Nacional que el jefe de la Policía de Tetuán le avisó semanas antes de la entrada masiva de migrantes en Ceuta y responsabiliza a mandos policiales marroquíes.
