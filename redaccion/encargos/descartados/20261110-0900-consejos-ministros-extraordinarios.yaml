seccion: espana
tema: Sánchez anuncia que habrá Consejos de Ministros extraordinarios para aprobar medidas sociales antes de las elecciones generales del 29 de noviembre.
destacado: false
fuentes:
- medio: Europa Press
  titulo: Sánchez avanza que habrá Consejos de Ministros extraordinarios para aprobar medidas sociales antes de las generales
  url: https://www.europapress.es/nacional/noticia-sanchez-avanza-habra-consejos-ministros-extraordinarios-aprobar-medidas-sociales-antes-generales-20261110001609.html
motivo: 'el agente descarta el tema: Las fuentes no bastan para una noticia de 250 a 500 palabras sin añadir datos. Solo hay una fuente, una agencia (Europa Press), que recoge una entrevista de Sánchez en ''La Séptima''. Lo que se sabe es que habrá algún Consejo de Ministros extraordinario con medidas sociales antes del 29 de noviembre, que no se han concretado esas medidas y que el indulto a Álvaro García Ortiz sigue sin aclararse si se llevará a uno de esos consejos. Con esos hechos el cuerpo quedaría muy por debajo del mínimo, y rellenarlo exigiría datos o explicaciones que no están en la fuente. Conviene retomarla cuando el Gobierno convoque el primer Consejo extraordinario o concrete las medidas.'
