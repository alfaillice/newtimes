motivo: 'la verificación encontró datos sin sostén: "el organismo que regula las telecomunicaciones en el país": las fuentes no describen a la FCC con esa función.; "según explicó la propia FCC" (energía solar de los satélites): la fuente 1 atribuye esa afirmación a Brendan Carr, no a un comunicado de la FCC.; "Sir Martin Sweeting, pionero de los satélites británicos": las fuentes solo le identifican como fundador y presidente ejecutivo de Surrey Satellite Technology Ltd; "pionero de los satélites británicos" no aparece.; "consideró la idea técnicamente viable, aunque dudó de que tenga sentido a gran escala": la fuente dice que si tiene sentido'
