tema: Muere en el hospital de Cruces la mujer de 34 años apuñalada el jueves en Bilbao por su expareja, que tenía una orden de alejamiento; caso de violencia machista. Sin detalles morbosos ni datos identificativos de la víctima ni de los menores.
