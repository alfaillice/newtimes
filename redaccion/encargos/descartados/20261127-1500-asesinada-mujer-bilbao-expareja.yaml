motivo: 'la verificación encontró datos sin sostén: Atribución: el artículo dice que la orden de alejamiento en vigor la informaron «la Policía Nacional y el Departamento vasco de Seguridad». En las fuentes, la orden de alejamiento se atribuye solo a fuentes de la Policía Nacional (y a EFE citando «las mismas fuentes»). El Departamento vasco de Seguridad aparece confirmando la muerte y los antecedentes, pero no la orden de alejamiento.'
