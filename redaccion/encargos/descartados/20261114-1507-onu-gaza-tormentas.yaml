motivo: 'la verificación encontró datos sin sostén: Titular: "La ONU afirma" atribuye el comunicado a la ONU como institución. Las fuentes dicen que lo emite el Equipo Humanitario (HCT), que reúne a agencias de la ONU y también a ONG internacionales y locales. No consta que la ONU, como tal, lo afirme.'
