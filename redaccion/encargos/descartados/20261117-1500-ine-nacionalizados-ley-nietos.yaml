motivo: 'la verificación encontró datos sin sostén: La atribución de la exclusión de 1.283 electores a la «Oficina del Censo Electoral» en el informe de 5 de noviembre no aparece en las fuentes. Europa Press solo indica que «en el informe de 5 de noviembre se comprobó que procedía la exclusión de 1.283», sin nombrar al autor. La OCE sí figura como autora de otro informe, el que motivó la exclusión de los 9.707 registros.'
