seccion: espana
tema: José Bono pide a Felipe González que no haga el tonto con su intención de votar en blanco en las elecciones del 29 de noviembre.
destacado: false
fuentes:
- medio: Europa Press
  titulo: 'Bono, a González por su voto en blanco: No hagas el tonto. El PSOE te debe mucho a ti pero tú más al PSOE'
  url: https://www.europapress.es/castilla-lamancha/noticia-bono-gonzalez-voto-blanco-no-hagas-tonto-psoe-te-debe-mucho-ti-mas-psoe-20261121214158.html
motivo: 'el agente descarta el tema: Las fuentes no bastan para una noticia de 250 a 500 palabras con rigor. Solo hay una fuente, una agencia (Europa Press), que recoge una intervención de José Bono en un acto electoral en Alcázar de San Juan. No aporta datos verificables sobre la intención de voto de Felipe González, que solo aparece como premisa de las declaraciones de Bono, ni reacciones de otras partes. El resto del contenido son titulares ajenos al asunto, que no pueden usarse. Ampliar la pieza exigiría relleno o parafrasear la misma intervención, lo que la guía no permite.'
