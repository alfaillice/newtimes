motivo: 'la verificación encontró datos sin sostén: La definición de metadatos («Los metadatos son los datos que describen un archivo, como su fecha de creación o su ubicación») no aparece en las fuentes. Las fuentes solo mencionan «metadatos relacionados» sin explicarlos.'
