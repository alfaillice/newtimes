seccion: internacional
tema: "La relatora de la ONU Francesca Albanese abandona el aeropuerto de Costa Rica tras más de 50 horas retenida, después de que la justicia ordenara su traslado a un hotel. Recoger los motivos que dio públicamente la Dirección de Migración tal como figuran en las fuentes, sin afirmar que no se han explicado."
