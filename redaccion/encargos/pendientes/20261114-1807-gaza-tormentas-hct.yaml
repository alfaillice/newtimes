tema: El Equipo Humanitario en Palestina (HCT, que reúne a agencias de la ONU y ONG) afirma que el impacto de las tormentas en Gaza era evitable y reclama ayuda urgente. Atribuye el mensaje al Equipo Humanitario, no a la ONU como institución, y no uses nombres ni cifras que no estén en la fuente.
