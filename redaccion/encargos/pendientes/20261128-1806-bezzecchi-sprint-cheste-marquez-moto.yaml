seccion: deportes
tema: "Marco Bezzecchi (Aprilia) gana la carrera Sprint del Gran Premio de la Comunitat Valenciana en Cheste, última cita del Mundial de MotoGP, por delante de Jorge Martín. Marc Márquez, en su última Sprint antes de retirarse, sufre el incendio de su moto tras un fallo en la salida, es sancionado con una doble long lap y termina decimotercero."
