seccion: internacional
tema: "La relatora especial de la ONU para los Territorios Palestinos Ocupados, Francesca Albanese, abandona el aeropuerto de San José tras permanecer retenida desde el jueves, después de que la Sala Constitucional de Costa Rica ordenara permitir su traslado a un hotel; tiene prevista su salida del país hacia México. Desarrollo de la pieza ya publicada sobre la denegación de entrada."
