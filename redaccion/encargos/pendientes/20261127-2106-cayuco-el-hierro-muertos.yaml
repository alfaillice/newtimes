seccion: sociedad
tema: "Varios migrantes muertos y seis heridos, evacuados en helicóptero, en un cayuco rescatado este viernes a la deriva frente a El Hierro y remolcado por la Guardia Civil hacia la isla. Da la cifra de fallecidos más alta que recojan al menos dos fuentes y, si una fuente trae una cifra mayor, atribúyela a la autoridad que la ofrece o no la des. No nombres ningún medio en el texto: las fuentes van solo al final."
