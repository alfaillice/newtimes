tema: El PSOE propone en su programa para las elecciones generales del 29 de noviembre blindar unos 19.000 millones de euros entre 2026 y 2030 para conservar y mantener la red ferroviaria e impulsar un Pacto de Estado por la Seguridad Ferroviaria.
