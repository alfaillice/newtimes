# IndexNow: avisa al instante a Bing, Yandex, Naver y Seznam de cada página
# nueva o cambiada. La clave se publica en /<clave>.txt para demostrar la propiedad.
indexnow_clave: "46d4b416deffde49f780f985823583aa"

titular:
  nombre: "JM Triviño Godoy"
  nif: "22009686C"
  domicilio: "Partida Carrus P1, 137, 03205 Elche (Alicante), España"
  email: "redaccion@newtimes.news"
  registro: ""   # inscripción registral si es sociedad; vacío si es persona física

# Sección Directo: señal de televisión insertada con el reproductor oficial
# de YouTube (dominio sin cookies). Para cambiar de canal, cambia el ID.
directo:
  youtube_id: zTv0hCakAhg
  canal: FRANCE 24 Español
  canal_url: https://www.youtube.com/@France24_es

# Publicidad (Google AdSense). Cada bloque solo aparece cuando tiene su
# identificador ("data-ad-slot", 10 cifras) creado en el panel de AdSense.
publicidad:
  activa: true
  cliente: ca-pub-8207026302114375
  bloques:              # bloque adaptable «encabezado» (5085417706), reutilizado
    portada: "5085417706"          # banda horizontal entre secciones de la portada
    articulo: "5085417706"         # dentro del texto, tras el tercer párrafo
    articulo_final: "5085417706"   # al final de la noticia, tras las fuentes
    seccion: "5085417706"          # entre las noticias de cada sección
    directo: "5085417706"          # en el minuto a minuto, bajo el vídeo

# Imágenes: solo se descargan de estos servidores (bancos con licencias
# libres y fuentes oficiales que permiten la reutilización). Cualquier otra
# procedencia, incluidos los medios de comunicación, se rechaza.
imagenes_permitidas:
  - upload.wikimedia.org
  - images.pexels.com
  - images.unsplash.com
  - live.staticflickr.com
  - www.lamoncloa.gob.es
  - audiovisual.ec.europa.eu
  - multimedia.europarl.europa.eu
  - images-assets.nasa.gov
  - www.nasa.gov
  - www.esa.int

