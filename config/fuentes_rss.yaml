# Fuentes RSS que lee el redactor automático del servidor (redaccion/servidor/redactor.py).
# Solo medios y organismos de la lista de redaccion/GUIA.md. Si un feed deja de
# responder, el redactor lo avisa en el registro y sigue con los demás.
# Formato: sección -> lista de {medio, url}
